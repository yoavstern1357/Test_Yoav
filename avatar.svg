<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="The Dumpling Boy logo">
  <rect width="200" height="200" fill="#ffe3b8"/>
  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".9">
    <path d="M40 70c-8-8 8-14 0-24"/>
    <path d="M160 70c-8-8 8-14 0-24"/>
  </g>
  <!-- dumpling body -->
  <path d="M28 140c0-44 32-72 72-72s72 28 72 72c0 18-30 26-72 26s-72-8-72-26z"
        fill="#fffaf0" stroke="#3b2a1a" stroke-width="5" stroke-linejoin="round"/>
  <!-- conical leaf hat (non la) -->
  <path d="M100 14 L176 86 Q100 100 24 86 Z"
        fill="#ecc66a" stroke="#3b2a1a" stroke-width="5" stroke-linejoin="round"/>
  <!-- leaf ribs -->
  <g fill="none" stroke="#c99a3a" stroke-width="2.5" stroke-linecap="round">
    <path d="M100 18 L60 89"/>
    <path d="M100 18 L80 92"/>
    <path d="M100 18 L100 93"/>
    <path d="M100 18 L120 92"/>
    <path d="M100 18 L140 89"/>
    <path d="M58 54 Q100 62 142 54"/>
  </g>
  <!-- chin ribbon -->
  <path d="M50 90 Q54 120 70 130 M150 90 Q146 120 130 130" fill="none" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="78" cy="124" r="7" fill="#3b2a1a"/>
  <circle cx="122" cy="124" r="7" fill="#3b2a1a"/>
  <circle cx="80" cy="121" r="2.2" fill="#fff"/>
  <circle cx="124" cy="121" r="2.2" fill="#fff"/>
  <ellipse cx="62" cy="140" rx="9" ry="5" fill="#ff9e9e" opacity=".8"/>
  <ellipse cx="138" cy="140" rx="9" ry="5" fill="#ff9e9e" opacity=".8"/>
  <path d="M90 138c5 7 15 7 20 0" fill="none" stroke="#3b2a1a" stroke-width="4" stroke-linecap="round"/>
</svg>
